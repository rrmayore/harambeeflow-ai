    <script>
      (function() {
        try {
          var _rawFetch = window.fetch;
          if (_rawFetch) {
            var _activeFetch = _rawFetch;
            var descriptor = {
              configurable: true,
              enumerable: true,
              get: function() { return _activeFetch; },
              set: function(val) { _activeFetch = val; }
            };
            Object.defineProperty(window, 'fetch', descriptor);
            if (typeof globalThis !== 'undefined') {
              Object.defineProperty(globalThis, 'fetch', descriptor);
            }
          }
        } catch (e) {
          console.warn("Fetch override failed, continuing normally.", e);
        }
      })();
    </script>
